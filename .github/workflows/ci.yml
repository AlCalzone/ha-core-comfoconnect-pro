name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Catch changes on core's dev branch that break the integration
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Test against core dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: integration
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: home-assistant/core
          ref: dev
          path: core
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Copy the integration into core
        run: integration/script/install-into-core.sh core
      - name: Install core and the test dependencies
        working-directory: core
        run: |
          uv venv .venv --python 3.14
          pin() { grep -ihE "^$1==" requirements_all.txt homeassistant/package_constraints.txt | head -1; }
          uv pip install --python .venv/bin/python -e . -r requirements_test.txt -r requirements_test_pre_commit.txt \
            "$(pin 'modbus-connection\[tmodbus\]')" "$(pin tmodbus)" "$(pin pymodbus)" \
            "$(pin paho-mqtt)" "$(pin aiohasupervisor)" "$(pin aiousbwatcher)" "$(pin serialx)" \
            "$(pin infrared-protocols)" \
            "comfoconnect-pro-modbus @ git+https://github.com/AlCalzone/comfoconnect-pro-modbus@main"
      - name: Generate translations
        working-directory: core
        run: .venv/bin/python -m script.translations develop --all
      - name: Run the tests
        working-directory: core
        run: >
          .venv/bin/python -m pytest tests/components/comfoconnect_pro
          --cov=homeassistant.components.comfoconnect_pro --cov-report=term-missing
          --cov-fail-under=95
      - name: Mypy
        working-directory: core
        # Regenerate mypy.ini first, so the strict-typing entry applies. Then
        # silence the modules mypy follows, whose requirements are missing.
        run: |
          PATH="$PWD/.venv/bin:$PATH" .venv/bin/python -m script.hassfest -p mypy_config
          .venv/bin/mypy --follow-imports=silent homeassistant/components/comfoconnect_pro
      - name: Hassfest
        working-directory: core
        # Skip quality_scale until the brands entry exists, because it fails
        # the brands rule
        run: >
          PATH="$PWD/.venv/bin:$PATH" .venv/bin/python -m script.hassfest
          --integration-path homeassistant/components/comfoconnect_pro
          --skip-plugins quality_scale
      - name: Ruff
        working-directory: core
        run: |
          .venv/bin/ruff check homeassistant/components/comfoconnect_pro tests/components/comfoconnect_pro
          .venv/bin/ruff format --check homeassistant/components/comfoconnect_pro tests/components/comfoconnect_pro
